# Re-download the source data, re-run the projections, and commit the diff.
#
# The deployed app reads the parquet cache that lives in this repo, so a commit here is
# how the shared app learns about a trade, a signing or last night's games: Streamlit
# Cloud redeploys on a push to the deployed branch and picks the new data up.
#
# Deliberately scheduled rather than done on request. A projection people are reading
# should change at a moment somebody can point at, and the diff on data/ and output/ is
# the record of what changed.
name: Refresh data and projections

on:
  schedule:
    - cron: "20 11 * * 2"      # Tuesdays, 11:20 UTC (early morning North America)
  workflow_dispatch:            # and whenever you ask for it from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      # --refresh re-downloads MoneyPuck and the NHL API and rewrites data/raw, then
      # writes the projection CSVs. PYTHONUTF8 because accented names are not optional.
      - name: Refresh
        env:
          PYTHONUTF8: "1"
        run: python run.py --refresh

      - name: Rebuild the workbook export
        env:
          PYTHONUTF8: "1"
        run: python build_workbook.py

      - name: Commit anything that changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw output
          if git diff --cached --quiet; then
            echo "No change in the source data."
          else
            git commit -m "Refresh source data and projections ($(date -u +%Y-%m-%d))"
            git push
          fi
